name: Rust CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: clippy

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  check:
    name: Check (Rust ${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable
          - 1.85.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run workspace tests and diagnostic snapshots
        if: matrix.toolchain == 'stable'
        run: cargo test --workspace

      # trybuild snapshots contain compiler diagnostics that vary across Rust versions.
      - name: Run MSRV tests without diagnostic snapshots
        if: matrix.toolchain == '1.85.0'
        run: |
          cargo test -p builder_pattern -p example
          cargo test -p builder_pattern_derive --lib --test lib --test ui_pass

      - name: Compile benchmark target
        run: cargo bench -p example --bench builder --no-run
